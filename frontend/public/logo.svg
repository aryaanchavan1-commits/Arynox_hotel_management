<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hotel Laxmi Elite logo">
  <!-- Luxury marquee frame -->
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c99526"/>
      <stop offset="100%" stop-color="#b97926"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f4c5b"/>
      <stop offset="100%" stop-color="#2a9d8a"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Pillared portico -->
  <ellipse cx="256" cy="300" rx="150" ry="28" fill="url(#gold)"/>
  <rect x="110" y="296" width="292" height="28" rx="14" fill="url(#teal)" filter="url(#soft)"/>
  <!-- Building body -->
  <rect x="96" y="160" width="320" height="176" rx="24" fill="#0f2b32"/>
  <!-- Central door + arch motif -->
  <rect x="202" y="240" width="108" height="96" rx="14" fill="url(#gold)"/>
  <circle cx="256" cy="288" r="16" fill="#0f2b32"/>
  <!-- Floating lanterns / hospitality lights -->
  <circle cx="96" cy="176" r="14" fill="#c99526"/>
  <circle cx="416" cy="176" r="14" fill="#c99526"/>
  <!-- Wordmark -->
  <text x="256" y="438" font-family="Georgia,serif" font-weight="700" font-size="46" fill="url(#teal)" text-anchor="middle">Laxmi Elite</text>
  <text x="256" y="478" font-family="Georgia,serif" font-weight="400" font-size="26" fill="#0f2b32" text-anchor="middle">HOTEL</text>
</svg>
